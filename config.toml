name = "Portkey Mistral prices"
url = "https://configs.portkey.ai/pricing/mistral-ai.json"
kind = "object_keys"

[[sources]]
id = "portkey_vertex"
name = "Portkey Vertex prices"
url = "https://configs.portkey.ai/pricing/vertex-ai.json"
kind = "object_keys"
