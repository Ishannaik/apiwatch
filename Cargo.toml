[package]
name = "apiwatch"
version = "0.1.0"
edition = "2021"
description = "Poll public LLM model catalogs, diff IDs, write a static dashboard."
license = "MIT"
publish = false

[dependencies]
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2.12", default-features = false, features = ["tls", "json", "gzip"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"
